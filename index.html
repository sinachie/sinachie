<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sinachie Attendance</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
  <h1>Sinachie Attendance</h1>
  <video id="video" width="640" height="480" autoplay muted></video>
  <div id="status">Loading models...</div>
  <!-- Add this ABOVE your existing video and buttons -->
<div id="authSection" style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc;">
  <h3>Login to Sinachie</h3>
  <input id="authEmail" type="email" placeholder="Email" />
  <input id="authPassword" type="password" placeholder="Password" />
  <button id="loginBtn">Login</button>
  <button id="signupBtn">Sign Up</button>
  <button id="logoutBtn" style="display:none;">Logout</button>
  <p id="authStatus"></p>
</div>
  <div id="appContent" style="display: none;">
    <input id="nameInput" placeholder="Enter name for registration" />
    <button id="registerBtn">Register Face</button>
    <button id="recognizeBtn">Recognize & Check In</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
