<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sinachie Facial Attendance</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: white; margin: 0; padding: 20px; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    #authSection { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
    input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: white; }
    button { padding: 10px 15px; margin: 5px; border: none; border-radius: 5px; background: #1a73e8; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    #logoutBtn { background: #d32f2f; }
    #appContent { display: none; max-width: 640px; margin: 0 auto; }
    #video-container { position: relative; width: 100%; max-width: 640px; margin: 0 auto; border-radius: 10px; overflow: hidden; background: #000; }
    video { width: 100%; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #status { margin: 15px 0; font-size: 16px; font-weight: bold; color: #4caf50; }
    footer { margin-top: 30px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>Sinachie Facial Attendance</h1>

  <div id="authSection">
    <h3>Login to Sinachie</h3>
    <input id="authEmail" type="email" placeholder="Email" />
    <input id="authPassword" type="password" placeholder="Password" />
    <div>
      <button id="loginBtn">Login</button>
      <button id="signupBtn">Sign Up</button>
    </div>
    <p id="authStatus" style="color: #ff9800; font-size: 14px;"></p>
  </div>

  <div id="appContent">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h3 style="color:#fff; margin:0;">Sinachie POS</h3>
    <button id="logoutBtn" style="background: #d32f2f; margin:0;">Logout</button>
  </div>
  
  <div id="video-container" style="margin-top: 15px;">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  
  <div id="status" style="margin: 15px 0; font-size: 16px; font-weight: bold; color: #4caf50;">Initializing camera...</div>
  
  <!-- Registration Form -->
  <div id="registrationForm" style="background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
    <h4 style="margin-top: 0; color: #fff;">Register New Employee</h4>
    <input id="nameInput" placeholder="Full Name" style="margin-bottom: 10px; width: 95%;" />
    <input id="pinInput" placeholder="Create 4-Digit PIN" maxlength="4" style="margin-bottom: 10px; width: 95%;" />
    
    <input id="departmentInput" placeholder="Type Department (e.g. Sales, HR)" style="width: 95%; padding: 10px; margin-bottom: 10px; border-radius: 5px; background: #2a2a2a; color: white; border: 1px solid #333;" />
    
    <button id="registerBtn" disabled style="width: 100%;">Register Face & PIN</button>
  </div>

  <div style="margin-top: 10px;">
    <button id="recognizeBtn" disabled style="width: 100%; padding: 15px; font-size: 18px;">Recognize & Check In</button>
  </div>
</div>

<!-- Admin Dashboard -->
<div id="adminDashboard" style="display: none; margin-top: 40px; background: #1e1e1e; padding: 20px; border-radius: 10px;">
  <h2 style="color: #fff; margin-top: 0;">Live Attendance Log</h2>
  <button id="refreshLogsBtn" style="margin-bottom: 15px; background: #4caf50;">Refresh Logs</button>
  <div style="overflow-x: auto;">
    <table style="width: 100%; border-collapse: collapse; color: #fff; text-align: left; font-size: 14px;">
      <thead>
        <tr style="border-bottom: 2px solid #555;">
          <th style="padding: 8px;">Name</th>
          <th style="padding: 8px;">Dept</th>
          <th style="padding: 8px;">Time</th>
        </tr>
      </thead>
      <tbody id="logsTableBody"></tbody>
    </table>
  </div>
</div>

  <footer>&copy; 2026 Sinachie. All Rights Reserved.</footer>
  <script src="app.js"></script>
</body>
</html>
