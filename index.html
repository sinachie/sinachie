<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sinachie Facial Attendance</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: white; margin: 0; padding: 20px; text-align: center; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    #authSection { background: #1e1e1e; padding: 20px; border-radius: 10px; max-width: 400px; margin: 0 auto; }
    input { width: 90%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: white; }
    button { padding: 10px 15px; margin: 5px; border: none; border-radius: 5px; background: #1a73e8; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    #logoutBtn { background: #d32f2f; }
    #appContent { display: none; max-width: 640px; margin: 0 auto; }
    #video-container { position: relative; width: 100%; max-width: 640px; margin: 0 auto; border-radius: 10px; overflow: hidden; background: #000; }
    video { width: 100%; display: block; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    #status { margin: 15px 0; font-size: 16px; font-weight: bold; color: #4caf50; }
    footer { margin-top: 30px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <h1>Sinachie Enterprise POS</h1>

  <!-- AUTH SECTION (Only shows if not logged in) -->
  <div id="authSection">
  <h3>Secure Login / Register</h3>
  
  <div class="input-group">
    <input id="authEmail" type="email" placeholder="Work Email (e.g. name@gmail.com)" />
  </div>
  
  <div class="input-group">
    <input id="authPassword" type="password" placeholder="Password" />
    <span class="toggle-password" onclick="togglePassword('authPassword', this)">👁️</span>
  </div>

  <!-- NEW: Company Name Input (Only shows during signup) -->
  <div class="input-group" id="companyNameGroup" style="display: block;">
    <input id="companyNameInput" type="text" placeholder="Company Name (e.g. Esther Concept)" />
  </div>

  <div class="input-group">
    <input id="companyCodeInput" type="text" placeholder="Optional: Join Code (Leave blank if new)" />
  </div>

  <div>
    <button id="loginBtn" style="display: none;">Login to Existing Account</button>
    <button id="signupBtn">Create Account</button>
  </div>
  <p id="authStatus" style="color: #ff9800; font-size: 14px; font-weight: bold; margin-top: 10px;"></p>
  
  <p style="font-size: 12px; color: #888; margin-top: 15px; cursor: pointer;" onclick="toggleAuthMode()">
    <u id="toggleText">Already have an account? Click here to Login.</u>
  </p>
</div>

  <!-- APP CONTENT (Employee Terminal) -->
  <div id="appContent">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
  <div>
    <h3 style="margin:0;">Terminal Active</h3>
    <div id="companyInfo" style="font-size: 12px; color: #888; margin-top: 4px;">
      Company: <span id="displayCompanyName">Loading...</span> | Code: <strong id="displayJoinCode" style="color:#4caf50;">...</strong>
    </div>
  </div>
  <button id="logoutBtn" style="background: #d32f2f; margin:0;">Logout</button>
</div>
    
    <div id="video-container">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    
    <div id="status" style="margin: 15px 0; font-size: 16px; font-weight: bold; color: #4caf50;">Initializing...</div>

    <!-- CHECK IN BUTTON -->
    <div style="margin-top: 10px;">
      <button id="recognizeBtn" disabled style="width: 100%; padding: 15px; font-size: 18px;">Recognize & Check In</button>
    </div>

    <!-- PIN FALLBACK -->
    <div id="pinFallback" style="display: none; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 15px;">
      <h4 style="margin-top: 0;">Camera Failed? Use PIN</h4>
      <input id="fallbackPin" placeholder="Enter 4-Digit PIN" type="password" maxlength="4" />
      <button id="pinCheckInBtn" style="width: 100%; background: #ff9800;">Check In with PIN</button>
    </div>

    <!-- ADMIN CONTROLS (Hidden by default) -->
    <button id="toggleAdminBtn" style="background: #555; margin-top: 20px; width: 100%;">⚙️ Open Admin Setup</button>
    
    <div id="adminPanel" style="display: none; margin-top: 20px;">
      <div id="adminRegistration" style="background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
  <h4 style="margin-top: 0;">Register New Employee</h4>
  <input id="nameInput" placeholder="Full Name" style="margin-bottom: 5px;" />
  <input id="pinInput" placeholder="Create 4-Digit PIN" maxlength="4" style="margin-bottom: 5px;" />
  <input id="departmentInput" placeholder="Department (e.g. Sales)" style="margin-bottom: 5px;" />
  
  <!-- NEW SHIFT INPUTS -->
  <div style="display: flex; gap: 10px; margin-bottom: 10px;">
    <div style="flex: 1;">
      <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 3px;">Shift Start</label>
      <input id="shiftStartInput" type="time" value="08:00" style="margin-bottom: 0; width: 100%;" />
    </div>
    <div style="flex: 1;">
      <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 3px;">Shift End</label>
      <input id="shiftEndInput" type="time" value="17:00" style="margin-bottom: 0; width: 100%;" />
    </div>
  </div>

  <button id="registerBtn" disabled style="width: 100%;">Capture & Register Face</button>
</div>

      <div id="adminDashboard" style="background: #1e1e1e; padding: 20px; border-radius: 10px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h2 style="color: #fff; margin:0;">Live Attendance</h2>
          <button id="exportCsvBtn" style="background: #007bff; margin:0;">Export CSV</button>
        </div>
        <button id="refreshLogsBtn" style="margin-bottom: 15px; background: #4caf50; width: 100%;">Refresh Logs</button>
        <div style="overflow-x: auto;">
          <table style="width: 100%; border-collapse: collapse; color: #fff; text-align: left; font-size: 14px;">
            <thead>
              <tr style="border-bottom: 2px solid #555;">
                <th style="padding: 8px;">Name</th>
                <th style="padding: 8px;">Dept</th>
                <th style="padding: 8px;">Time</th>
                <th style="padding: 8px;">Status</th>
              </tr>
            </thead>
            <tbody id="logsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <footer>&copy; 2026 Sinachie. All Rights Reserved.</footer>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script>
    function togglePassword(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === "password") { input.type = "text"; icon.innerHTML = "🙈"; }
      else { input.type = "password"; icon.innerHTML = "👁️"; }
    }
    let isSignupMode = false;
    function toggleAuthMode() {
      isSignupMode = !isSignupMode;
      document.getElementById('companyCodeGroup').style.display = isSignupMode ? 'block' : 'none';
      document.getElementById('loginBtn').style.display = isSignupMode ? 'none' : 'inline-block';
      document.getElementById('signupBtn').style.display = isSignupMode ? 'inline-block' : 'none';
      document.getElementById('authStatus').textContent = '';
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
